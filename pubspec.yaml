name: adaptive_foreground
description: >-
  Flutter widget that auto-selects black or white foreground from background
  luminance. Includes status-bar sync and live RepaintBoundary pixel sampling.
version: 0.0.4

repository: https://github.com/mjaber5/flutter_adaptive_foreground
issue_tracker: https://github.com/mjaber5/flutter_adaptive_foreground/issues

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_native: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
